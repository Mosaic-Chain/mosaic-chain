[advisories]
version = 2
yanked = "warn"
ignore = [
    "RUSTSEC-2022-0061", # `parity-wasm` is deprecated 🤦
    "RUSTSEC-2024-0370", # `proc-macro-error` is unmaintained
    "RUSTSEC-2024-0384", # `instant` is unmaintained
    "RUSTSEC-2024-0436", # `paste` is unmaintained
    "RUSTSEC-2025-0057", # `fxhash` is unmaintained
    "RUSTSEC-2025-0118", # wasmtime linear memory is not used from multiple threads
    "RUSTSEC-2025-0161", # `libsecp256k1` is unmaintained - no safe upgrade available
    "RUSTSEC-2026-0002", # TODO: update polkadot-sdk when this (lru) is fixed there
    "RUSTSEC-2026-0006", # `wasmtime` segfault or unused out-of-sandbox load with `f64.copysign` operator on x86-64
    "RUSTSEC-2026-0020", # `wasmtime` WASI host interfaces are susceptible to guest-controlled resource exhaustion on the host
    "RUSTSEC-2026-0021", # `wasmtime` Panic adding excessive fields to a wasi:http/types.fields instance
    "RUSTSEC-2026-0085", # `wasmtime` panic when lifting `flags` component value
    "RUSTSEC-2026-0086", # `wasmtime` host data leakage with 64-bit tables and Winch
    "RUSTSEC-2026-0087", # `wasmtime` segfault or unused out-of-sandbox load with `f64x2.splat` operator on Cranelift x86-64
    "RUSTSEC-2026-0088", # `wasmtime` data leakage between pooling allocator instances
    "RUSTSEC-2026-0089", # `wasmtime` host panic when Winch compiler executes `table.fill`
    "RUSTSEC-2026-0091", # `wasmtime` out-of-bounds write or crash when transcoding component model strings
    "RUSTSEC-2026-0092", # `wasmtime` panic when transcoding misaligned component model UTF-16 strings
    "RUSTSEC-2026-0093", # `wasmtime` heap OOB read in component model UTF-16 to latin1+utf16 string transcoding
    "RUSTSEC-2026-0094", # `wasmtime` improperly masked return value from `table.grow` with Winch compiler backend
    "RUSTSEC-2026-0095", # `wasmtime` with Winch compiler backend may allow a sandbox-escaping memory access
    "RUSTSEC-2026-0096", # `wasmtime` miscompiled guest heap access enables sandbox escape on aarch64 Cranelift
    "RUSTSEC-2026-0097", # `rand` is unsound with a custom logger using `rand::rng()`
    "RUSTSEC-2026-0105", # `core2` is unmaintained
    "RUSTSEC-2026-0114", # `wasmtime` has a DoS vector
    "RUSTSEC-2026-0118", # `hickory-proto` has a DoS vector
    "RUSTSEC-2026-0119", # `hickory-proto` has a DoS vector
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MIT",
    "MIT-0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # copyleft:
    "GPL-3.0-or-later",                              # this makes our nodes GPL-3.0, too
    "GPL-3.0-only",                                  # this makes our nodes GPL-3.0, too
    "GPL-3.0-or-later WITH Classpath-exception-2.0", # like LGPL, but legally simpler
    "MPL-2.0",                                       # other source code files can use any license
]
confidence-threshold = 0.8
exceptions = [
    #{ allow = ["Zlib"], name = "adler32", version = "*" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
deny = [
    #{ name = "ansi_term", version = "=0.11.0", wrappers = [] },
]
skip = [
    #duplicates
    { name = "addr2line" },
    { name = "bitflags" },
    { name = "blake2" },
    { name = "block-buffer" },
    { name = "cargo_metadata" },
    { name = "cfg_aliases" },
    { name = "cipher" },
    { name = "core-foundation" },
    { name = "derive_more" },
    { name = "digest" },
    { name = "generic-array" },
    { name = "getrandom" },
    { name = "heck" },
    { name = "itertools" },
    { name = "lru" },
    { name = "memmap2" },
    { name = "multiaddr" },
    { name = "nix" },
    { name = "pallet-treasury", reason = "We forked an older version" },
    { name = "semver" },
    { name = "sp-crypto-hashing" },
    { name = "windows-core" },
    { name = "yamux" },
]
skip-tree = [
    # duplicate mess
    { name = "asn1-rs" },
    { name = "cid" },
    { name = "darling" },
    { name = "gimli" },
    { name = "hyper-rustls" },
    { name = "primitive-types" },
    { name = "jsonrpsee" },
    { name = "wasmtime" },
    { name = "mockall" },
    { name = "prost" },
    { name = "strum" },
]

[bans.workspace-dependencies]
duplicates = 'deny'
include-path-dependencies = true
unused = 'deny'

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Mosaic-Chain/polkadot-sdk?branch=unsafe-warp-sync-2506-1"]

[sources.allow-org]
#github = ["wigy_opensource_developer"]
#gitlab = [""]
#bitbucket = [""]
